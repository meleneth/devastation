---
devastation_domain: deva.station
devastation_root: /srv/devastation
devastation_user: "{{ lookup('env', 'USER') | default(ansible_user_id, true) }}"

devastation_subnets:
  services: 172.30.42.0/24
  service_gateway: 172.30.42.1
  dns: 172.30.42.10
  ca: 172.30.42.11
  registry: 172.30.42.12
  apt_cache: 172.30.42.13
  gitlab: 172.30.42.14
  runner: 172.30.42.15
  registry_cache: 172.30.42.16
  teamcity: 172.30.42.36
  npm_cache: 172.30.42.28
  pypi_cache: 172.30.42.29
  gem_cache: 172.30.42.30
  otel_collector: 172.30.42.17
  prometheus: 172.30.42.18
  jaeger: 172.30.42.19
  kind: 172.30.42.20
  grafana: 172.30.42.21
  loki: 172.30.42.22
  node_exporter: 172.30.42.23
  cadvisor: 172.30.42.24
  vault: 172.30.42.25
  eventline: 172.30.42.26
  storage: 172.30.42.27
  www: 172.30.42.35
  test_db: 172.30.42.31
  development_db: 172.30.42.32
  production_db: 172.30.42.33
  otel_db: 172.30.42.34
  app_gateway: 172.30.42.37
  iam_db: 172.30.42.38
  keystone_db: 172.30.42.39
  mail: 172.30.42.40
  iam: 172.30.42.41
  keystone: 172.30.42.42
  seaweed: 172.30.42.43
  playwright: 172.30.42.44
  apt_cache_transparent: 172.30.42.45

devastation_dns_records:
  - name: "{{ devastation_domain }}"
    ip: "{{ devastation_subnets.www }}"
  - name: "dns.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.dns }}"
  - name: "ca.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.ca }}"
  - name: "registry.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.registry }}"
  - name: "registry-cache.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.registry_cache }}"
  - name: "apt-cache.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.apt_cache }}"
  - name: "npm-cache.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.npm_cache }}"
  - name: "pypi-cache.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.pypi_cache }}"
  - name: "gem-cache.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.gem_cache }}"
  - name: "gitlab.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.gitlab }}"
  - name: "runner.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.runner }}"
  - name: "teamcity.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.teamcity }}"
  - name: "kind.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.kind }}"
  - name: "otel-collector.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.otel_collector }}"
  - name: "grafana.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.grafana }}"
  - name: "jaeger.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.jaeger }}"
  - name: "prometheus.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.prometheus }}"
  - name: "loki.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.loki }}"
  - name: "node-exporter.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.node_exporter }}"
  - name: "cadvisor.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.cadvisor }}"
  - name: "vault.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.vault }}"
  - name: "eventline.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.eventline }}"
  - name: "storage.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.storage }}"
  - name: "www.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.www }}"
  - name: "test-db.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.test_db }}"
  - name: "development-db.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.development_db }}"
  - name: "production-db.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.production_db }}"
  - name: "otel-db.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.otel_db }}"
  - name: "iam-db.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.iam_db }}"
  - name: "keystone-db.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.keystone_db }}"
  - name: "iam.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.app_gateway }}"
  - name: "mail.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.app_gateway }}"
  - name: "smtp.mail.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.mail }}"
  - name: "keystone.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.app_gateway }}"
  - name: "s3.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.app_gateway }}"
  - name: "seaweed.{{ devastation_domain }}"
    ip: "{{ devastation_subnets.app_gateway }}"

devastation_internal_hostnames:
  - "{{ devastation_domain }}"
  - "dns.{{ devastation_domain }}"
  - "ca.{{ devastation_domain }}"
  - "registry.{{ devastation_domain }}"
  - "registry-cache.{{ devastation_domain }}"
  - "apt-cache.{{ devastation_domain }}"
  - "npm-cache.{{ devastation_domain }}"
  - "pypi-cache.{{ devastation_domain }}"
  - "gem-cache.{{ devastation_domain }}"
  - "gitlab.{{ devastation_domain }}"
  - "runner.{{ devastation_domain }}"
  - "teamcity.{{ devastation_domain }}"
  - "kind.{{ devastation_domain }}"
  - "otel-collector.{{ devastation_domain }}"
  - "grafana.{{ devastation_domain }}"
  - "jaeger.{{ devastation_domain }}"
  - "prometheus.{{ devastation_domain }}"
  - "loki.{{ devastation_domain }}"
  - "node-exporter.{{ devastation_domain }}"
  - "cadvisor.{{ devastation_domain }}"
  - "vault.{{ devastation_domain }}"
  - "eventline.{{ devastation_domain }}"
  - "storage.{{ devastation_domain }}"
  - "www.{{ devastation_domain }}"
  - "test-db.{{ devastation_domain }}"
  - "development-db.{{ devastation_domain }}"
  - "production-db.{{ devastation_domain }}"
  - "otel-db.{{ devastation_domain }}"
  - "iam-db.{{ devastation_domain }}"
  - "keystone-db.{{ devastation_domain }}"
  - "iam.{{ devastation_domain }}"
  - "mail.{{ devastation_domain }}"
  - "smtp.mail.{{ devastation_domain }}"
  - "keystone.{{ devastation_domain }}"
  - "s3.{{ devastation_domain }}"
  - "seaweed.{{ devastation_domain }}"

devastation_extra_dns_records: []
devastation_extra_internal_hostnames: []
devastation_portal_include_extra_dns_sites: true
devastation_portal_extra_browser_links: []
devastation_portal_extra_endpoint_links: []

devastation_paths:
  certs: "{{ devastation_root }}/certs"
  ca: "{{ devastation_root }}/ca"
  workload_trust: "{{ devastation_root }}/workload-trust"
  secrets: "{{ devastation_root }}/secrets"
  compose: "{{ devastation_root }}/compose"
  dns: "{{ devastation_root }}/dns"
  registry: "{{ devastation_root }}/registry"
  apt_cache: "{{ devastation_root }}/apt-cache"
  package_caches: "{{ devastation_root }}/package-caches"
  kind: "{{ devastation_root }}/kind"
  gitlab: "{{ devastation_root }}/gitlab"
  gitlab_runner: "{{ devastation_root }}/gitlab-runner"
  observability: "{{ devastation_root }}/observability"
  vault: "{{ devastation_root }}/vault"
  teamcity: "{{ devastation_root }}/teamcity"
  eventline: "{{ devastation_root }}/eventline"
  storage: "{{ devastation_root }}/storage"
  app_services: "{{ devastation_root }}/app-services"
  www: "{{ devastation_root }}/www"
  postgres: "{{ devastation_root }}/postgres"
  logs: "{{ devastation_root }}/logs"

base_packages_extra: []
apt_lock_timeout: 300
host_sshd_enabled: false
host_sshd_service_names:
  - ssh.service
  - sshd.service
host_sysctl_settings:
  fs.inotify.max_user_instances: 8192
  fs.inotify.max_user_watches: 1048576
base_packages_default:
  - apt-transport-https
  - awscli
  - bash
  - build-essential
  - ca-certificates
  - conntrack
  - coreutils
  - curl
  - dnsutils
  - fd-find
  - git
  - gnupg
  - iproute2
  - jq
  - make
  - netcat-openbsd
  - openssl
  - pipx
  - python3
  - python3-pip
  - python3-venv
  - ripgrep
  - rsync
  - socat
  - sudo
  - unzip
  - wget
  - xz-utils
  - yq

user_setup_enabled: true
user_setup_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
user_setup_shell_profile: "{{ user_setup_home }}/.profile"
user_setup_zsh_startup_files:
  - "{{ user_setup_home }}/.zprofile"
  - "{{ user_setup_home }}/.zshrc"
user_setup_install_latest_versions: true
user_setup_configure_package_mirrors: true
user_setup_npm_registry: "http://npm-cache.{{ devastation_domain }}:{{ npm_cache_port }}"
user_setup_pip_index_url: "http://pypi-cache.{{ devastation_domain }}:{{ pypi_cache_port }}/root/pypi/+simple/"
user_setup_gem_source: "http://gem-cache.{{ devastation_domain }}:{{ gem_cache_port }}"
desktop_notifications_enabled: true
desktop_notification_packages:
  - dunst
  - libnotify-bin
desktop_notifications_icon: dialog-information
dunst_font: Monospace 10
dunst_frame_color: "#5f87af"
dunst_low_background: "#1f2328"
dunst_low_foreground: "#d0d7de"
dunst_low_timeout: 4
dunst_normal_background: "#20242b"
dunst_normal_foreground: "#f0f3f6"
dunst_normal_timeout: 8
dunst_critical_background: "#3a1d24"
dunst_critical_foreground: "#ffffff"
dunst_critical_frame_color: "#d73a49"
pyenv_repo: https://github.com/pyenv/pyenv.git
pyenv_root: "{{ user_setup_home }}/.pyenv"
rbenv_repo: https://github.com/rbenv/rbenv.git
rbenv_root: "{{ user_setup_home }}/.rbenv"
ruby_build_repo: https://github.com/rbenv/ruby-build.git
nvm_repo: https://github.com/nvm-sh/nvm.git
nvm_version: v0.40.1
nvm_root: "{{ user_setup_home }}/.nvm"
tfenv_repo: https://github.com/tfutils/tfenv.git
tfenv_root: "{{ user_setup_home }}/.tfenv"
goenv_repo: https://github.com/go-nv/goenv.git
goenv_root: "{{ user_setup_home }}/.goenv"
rustup_init_url: https://sh.rustup.rs
cargo_home: "{{ user_setup_home }}/.cargo"
rustup_home: "{{ user_setup_home }}/.rustup"
rustup_init_path: "{{ user_setup_home }}/.rustup-init"

meslo_lgs_nerd_font_enabled: true
meslo_lgs_nerd_font_base_url: https://raw.githubusercontent.com/romkatv/powerlevel10k-media/master
meslo_lgs_nerd_font_dir: /usr/local/share/fonts/devastation/MesloLGS
meslo_lgs_nerd_font_files:
  - MesloLGS NF Regular.ttf
  - MesloLGS NF Bold.ttf
  - MesloLGS NF Italic.ttf
  - MesloLGS NF Bold Italic.ttf

install_nodejs_from_distro: true
install_docker_engine: true
docker_users:
  - "{{ devastation_user }}"
docker_daemon_dns: "{{ devastation_subnets.dns }}"
docker_registry_mirrors:
  - "http://registry-cache.{{ devastation_domain }}:5000"
docker_insecure_registries:
  - "registry-cache.{{ devastation_domain }}:5000"
docker_insecure_registry_fallback: false

neovim_create_config_if_missing: true
neovim_config_dir: "{{ lookup('env', 'HOME') }}/.config/nvim"
neovim_install_distro_package: false
neovim_remove_distro_package: true
neovim_official_release_url: https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
neovim_official_archive: /tmp/devastation-nvim-linux-x86_64.tar.gz
neovim_install_root: /opt
neovim_extracted_dir: /opt/nvim-linux-x86_64
neovim_binary_path: /usr/local/bin/nvim
neovim_force_official_download: false
lazyvim_enabled: true
lazyvim_starter_repo: https://github.com/LazyVim/starter.git
lazyvim_starter_version: main

dns_upstream_resolvers:
  - 1.1.1.1
  - 9.9.9.9
dns_configure_hosts_file: true
dns_configure_host_resolver: true
dns_systemd_resolved_dropin: /etc/systemd/resolved.conf.d/devastation.conf

# Docker and KIND clients resolve these well-known distribution repositories to
# the transparent port-80 frontend. apt-cacher-ng resolves its own upstreams
# through dns_upstream_resolvers, preventing a proxy loop.
apt_cache_transparent_enabled: true
apt_cache_repository_hostnames:
  - deb.debian.org
  - security.debian.org
  - archive.debian.org
  - ftp.debian.org
  - archive.ubuntu.com
  - security.ubuntu.com
  - ports.ubuntu.com
  - old-releases.ubuntu.com

ca_install_host_trust: true
ca_install_browser_nss_trust: true
ca_nss_cert_name: "Devastation Local Root CA"
ca_browser_nss_db_paths:
  - "{{ user_setup_home }}/.local/share/pki/nssdb"
  - "{{ user_setup_home }}/.pki/nssdb"
ca_common_name: "Devastation Local Root CA"
ca_ephemeral_root: true
ca_force_rotate: false
ca_rotation_script: /usr/local/bin/devastation-rotate-trust-universe
ca_leaf_certificates:
  - "{{ devastation_domain }}"
  - "www.{{ devastation_domain }}"
  - "registry.{{ devastation_domain }}"
  - "gitlab.{{ devastation_domain }}"
  - "ca.{{ devastation_domain }}"
  - "apt-cache.{{ devastation_domain }}"
  - "kind.{{ devastation_domain }}"
  - "iam.{{ devastation_domain }}"
  - "mail.{{ devastation_domain }}"
  - "keystone.{{ devastation_domain }}"
  - "s3.{{ devastation_domain }}"
  - "seaweed.{{ devastation_domain }}"
ca_extra_leaf_certificates: []
cert_subject_country: US
cert_valid_days: 825

registry_enable_auth: false
registry_htpasswd_user: devastation
registry_pull_through_cache_enabled: true
registry_pull_through_remoteurl: https://registry-1.docker.io
registry_metrics_port: 5001

apt_cache_port: 3142
apt_cache_transparent_port: 80
apt_cache_configure_host: true
apt_cache_prefetch_packages:
  - git
  - curl
  - ca-certificates
  - build-essential
  - python3
  - python3-venv
  - jq
  - ripgrep
apt_cache_prefetch_images:
  - debian:bookworm-slim
  - ubuntu:24.04
  - alpine:3.20
  - kindest/node:v1.30.0

npm_cache_image: verdaccio/verdaccio:6
npm_cache_port: 4873
npm_cache_upstream: https://registry.npmjs.org/
npm_cache_prefetch_packages:
  - typescript
  - vite
  - eslint

package_cache_build_network: host

pypi_cache_base_image: python:3.13-slim
pypi_cache_image: devastation/devpi-cache:6.20.0
pypi_cache_port: 3141
pypi_cache_password: devastation
devpi_server_version: 6.20.0
pypi_cache_prefetch_packages:
  - pip
  - setuptools
  - wheel
  - requests

gem_cache_base_image: ruby:3.3-slim
gem_cache_image: devastation/gemstash-cache:2.8.2
gem_cache_port: 9292
gemstash_version: 2.8.2
gem_cache_upstream: https://rubygems.org
gem_cache_prefetch_packages:
  - bundler
  - rake

kind_cluster_name: devastation
kind_version: v0.23.0
kubectl_version: v1.30.2
kind_node_image: kindest/node:v1.30.0
kind_api_port: 6443
kind_configure_user_kubeconfig: true
kind_user_kubeconfig: "{{ user_setup_home }}/.kube/config"
helm_version: v4.2.0
k9s_version: v0.50.18
lazydocker_version: 0.25.0
trivy_version: 0.70.0
ghostty_install_enabled: true
ghostty_community_deb_enabled: true
ghostty_community_release_api: https://api.github.com/repos/mkasberg/ghostty-ubuntu/releases/latest
blender_install_enabled: true
blender_remove_distro_package: true
blender_official_release_base_url: https://download.blender.org/release
blender_install_root: /opt/blender
blender_binary_path: /usr/local/bin/blender
istio_version: 1.30.0
istio_gateway_name: istio-ingressgateway
istio_gateway_service_type: ClusterIP
metallb_version: 0.16.1
metallb_helm_repo: https://metallb.github.io/metallb
argocd_version: v3.4.2
otel_operator_version: v0.151.0
kind_install_platform_addons: true
kind_sync_extra_leaf_certs_to_istio: true
kind_istio_tls_secret_namespace: istio-system
cert_manager_helm_repo: https://charts.jetstack.io
istio_helm_repo: https://istio-release.storage.googleapis.com/charts
argocd_manifest_url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"
otel_operator_manifest_url: "https://github.com/open-telemetry/opentelemetry-operator/releases/download/{{ otel_operator_version }}/opentelemetry-operator.yaml"

gitlab_version: "17.1.1-ce.0"
gitlab_hostname: "gitlab.{{ devastation_domain }}"
gitlab_external_url: "https://{{ gitlab_hostname }}"
gitlab_ssh_port: 22
gitlab_http_port: 8080
gitlab_https_port: 8443
gitlab_allow_existing_data: false
gitlab_migration_enabled: false
gitlab_backup_tar: ""
gitlab_old_config_path: ""
gitlab_old_logs_path: ""
gitlab_old_data_path: ""
gitlab_stop_grace_period: 10m

gitlab_runner_version: "alpine-v17.1.0"
gitlab_runner_authentication_token: ""
gitlab_runner_registration_token: ""
gitlab_runner_executor: docker
gitlab_runner_docker_image: docker:27
gitlab_runner_mount_docker_socket: false
gitlab_runner_tags: "local,devastation,docker"

postgres_version: "18.4"
postgres_stop_grace_period: 2m
postgres_default_user: devastation
postgres_default_password: devastation
postgres_databases:
  - service: test-db
    hostname: "test-db.{{ devastation_domain }}"
    subnet_key: test_db
    database: test_db
    host_port: 5433
  - service: development-db
    hostname: "development-db.{{ devastation_domain }}"
    subnet_key: development_db
    database: development_db
    host_port: 5434
  - service: production-db
    hostname: "production-db.{{ devastation_domain }}"
    subnet_key: production_db
    database: production_db
    host_port: 5435
  - service: otel-db
    hostname: "otel-db.{{ devastation_domain }}"
    subnet_key: otel_db
    database: otel_db
    host_port: 5436
  - service: iam-db
    hostname: "iam-db.{{ devastation_domain }}"
    subnet_key: iam_db
    database: iam
    host_port: 5437
  - service: keystone-db
    hostname: "keystone-db.{{ devastation_domain }}"
    subnet_key: keystone_db
    database: keystone
    host_port: 5438

vault_version: "1.19.5"
vault_dev_root_token: devastation
vault_port: 8200
vault_cli_install_enabled: true
vault_cli_archive: /tmp/devastation-vault_{{ vault_version }}_linux_amd64.zip
vault_cli_release_url: https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip
vault_project_secret_path: secret/data/projects
datawires_database_service: production-db
datawires_database_name: production_db
datawires_database_user: datawires
datawires_database_password: "{{ postgres_default_password }}"
teamcity_image: jetbrains/teamcity-server:latest
teamcity_port: 8111
teamcity_container_uid: "1000"
teamcity_container_gid: "1000"
goaws_image: admiralpiett/goaws:v0.5.4
goaws_port: 4100
minio_image: minio/minio:RELEASE.2025-04-22T22-12-26Z
minio_root_user: devastation
minio_root_password: devastation
minio_api_port: 9000
minio_console_port: 9001
app_gateway_image: nginx:1.27-alpine
keycloak_upstream_image: quay.io/keycloak/keycloak:26.0
keycloak_image: "registry.{{ devastation_domain }}/devastation-mirror/quay.io/keycloak/keycloak:26.0"
keycloak_realm: devastation
keycloak_admin_user: admin
keycloak_admin_password: devastation-admin
keycloak_dev_user: developer
keycloak_dev_password: devastation-dev
keycloak_demo_client_id: devastation-demo
keycloak_demo_client_secret: devastation-demo-secret
mailpit_image: axllent/mailpit:v1.21
mailpit_smtp_port: 1025
mailpit_ui_port: 8025
mailpit_default_from: "dev@deva.station"
playwright_upstream_image: mcr.microsoft.com/playwright:v1.49.1-noble
playwright_image: "registry.{{ devastation_domain }}/devastation-mirror/mcr.microsoft.com/playwright:v1.49.1-noble"
keystone_image: devastation/keystone-local:dev
keystone_node_base_image: node:22-bookworm-slim
keystone_admin_email: admin@deva.station
keystone_admin_password: devastation-admin
keystone_session_secret: devastation-keystone-session-secret-local-only
seaweedfs_image: chrislusf/seaweedfs:3.97
seaweedfs_region: us-east-1
seaweedfs_access_key: devastation
seaweedfs_secret_key: devastation-secret
seaweedfs_default_bucket: devastation-dev
www_image: nginx:1.27-alpine
www_http_port: 80
www_https_port: 443
docs_build_output: "{{ playbook_dir }}/../docs/.vitepress/dist"

grafana_image: grafana/grafana-enterprise:latest
grafana_admin_user: admin
grafana_admin_password: devastation
grafana_port: 3000
prometheus_image: prom/prometheus:latest
prometheus_port: 9090
prometheus_retention: 15d
loki_image: grafana/loki:3.6.0
loki_port: 3100
otel_collector_image: otel/opentelemetry-collector-contrib:0.153.0
otel_grpc_port: 4317
otel_http_port: 4318
otel_fluentforward_port: 8006
jaeger_upstream_image: cr.jaegertracing.io/jaegertracing/jaeger:2.19.0
jaeger_image: "registry.{{ devastation_domain }}/devastation-mirror/cr.jaegertracing.io/jaegertracing/jaeger:2.19.0"
jaeger_ui_port: 16686
node_exporter_image: prom/node-exporter:latest
cadvisor_upstream_image: gcr.io/cadvisor/cadvisor:latest
cadvisor_image: "registry.{{ devastation_domain }}/devastation-mirror/gcr.io/cadvisor/cadvisor:latest"
postgres_exporter_image: prometheuscommunity/postgres-exporter:latest

devastation_mirrored_images:
  - source: "{{ keycloak_upstream_image }}"
    target: "{{ keycloak_image }}"
