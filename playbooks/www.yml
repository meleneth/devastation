---
- name: Converge the devastation web portal
  hosts: localhost
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Check for ignored local cluster extension variables
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../cluster/devastation-local-vars.yml"
      register: cluster_local_vars

    - name: Load ignored local cluster extension variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../cluster/devastation-local-vars.yml"
      when: cluster_local_vars.stat.exists

  tasks:
    - name: Apply web portal role
      ansible.builtin.import_role:
        name: www
