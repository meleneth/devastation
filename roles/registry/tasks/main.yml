---
- name: Create registry directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ devastation_paths.registry }}"
    - "{{ devastation_paths.registry }}/data"
    - "{{ devastation_paths.registry }}/pull-through-cache"

- name: Create registry auth directory
  ansible.builtin.file:
    path: "{{ devastation_paths.registry }}/auth"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: registry_enable_auth

- name: Start registry services
  community.docker.docker_compose_v2:
    project_src: "{{ devastation_paths.compose }}"
    services:
      - registry
    state: present

- name: Start registry pull-through cache
  community.docker.docker_compose_v2:
    project_src: "{{ devastation_paths.compose }}"
    services:
      - registry-cache
    state: present
  when: registry_pull_through_cache_enabled

- name: Ensure Docker certificate trust directory exists
  ansible.builtin.file:
    path: /etc/docker/certs.d/registry.{{ devastation_domain }}
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Trust local CA for Docker registry
  ansible.builtin.copy:
    src: "{{ devastation_paths.ca }}/root-ca.crt"
    dest: /etc/docker/certs.d/registry.{{ devastation_domain }}/ca.crt
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Wait for private registry API
  ansible.builtin.uri:
    url: "https://registry.{{ devastation_domain }}/v2/"
    status_code: 200
  register: registry_api_wait
  retries: 24
  delay: 5
  until: registry_api_wait.status == 200

- name: Write mirrored image manifest
  ansible.builtin.copy:
    dest: "{{ devastation_paths.compose }}/mirrored-images.tsv"
    owner: root
    group: root
    mode: "0644"
    content: |
      # upstream	target
      {% for image in devastation_mirrored_images %}
      {{ image.source }}	{{ image.target }}
      {% endfor %}

- name: Install image mirror update script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../bin/devastation-mirror-images"
    dest: /usr/local/bin/devastation-mirror-images
    owner: root
    group: root
    mode: "0755"

- name: Mirror non-Docker-Hub images into the private registry
  ansible.builtin.command:
    argv:
      - /usr/local/bin/devastation-mirror-images
  changed_when: "'[push]' in image_mirror_result.stdout"
  register: image_mirror_result
