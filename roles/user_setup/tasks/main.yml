---
- name: Install language toolchain build dependencies
  ansible.builtin.apt:
    name:
      - autoconf
      - bison
      - libbz2-dev
      - libffi-dev
      - libgdbm-dev
      - libgdbm-compat-dev
      - libgmp-dev
      - liblzma-dev
      - libncurses-dev
      - libreadline-dev
      - libsqlite3-dev
      - libssl-dev
      - libyaml-dev
      - llvm
      - tk-dev
      - uuid-dev
      - xz-utils
      - zlib1g-dev
    state: present

- name: Clone pyenv for target user
  ansible.builtin.git:
    repo: "{{ pyenv_repo }}"
    dest: "{{ pyenv_root }}"
    version: master
    recursive: false
    update: "{{ user_setup_install_latest_versions | bool }}"
  become: true
  become_user: "{{ devastation_user }}"

- name: Clone rbenv for target user
  ansible.builtin.git:
    repo: "{{ rbenv_repo }}"
    dest: "{{ rbenv_root }}"
    version: master
    recursive: false
    update: "{{ user_setup_install_latest_versions | bool }}"
  become: true
  become_user: "{{ devastation_user }}"

- name: Ensure rbenv plugins directory exists
  ansible.builtin.file:
    path: "{{ rbenv_root }}/plugins"
    state: directory
    owner: "{{ devastation_user }}"
    group: "{{ devastation_user }}"
    mode: "0755"

- name: Clone ruby-build plugin for rbenv
  ansible.builtin.git:
    repo: "{{ ruby_build_repo }}"
    dest: "{{ rbenv_root }}/plugins/ruby-build"
    version: master
    recursive: false
    update: "{{ user_setup_install_latest_versions | bool }}"
  become: true
  become_user: "{{ devastation_user }}"

- name: Check for failed nvm test fixture submodule
  ansible.builtin.stat:
    path: "{{ nvm_root }}/test/fixtures/nvmrc/.git"
  register: nvm_failed_submodule

- name: Remove failed nvm test fixture submodule directory
  ansible.builtin.file:
    path: "{{ nvm_root }}/test/fixtures/nvmrc"
    state: absent
  when: nvm_failed_submodule.stat.exists

- name: Clone nvm for target user
  ansible.builtin.git:
    repo: "{{ nvm_repo }}"
    dest: "{{ nvm_root }}"
    version: "{{ nvm_version }}"
    recursive: false
    update: false
  become: true
  become_user: "{{ devastation_user }}"

- name: Clone tfenv for target user
  ansible.builtin.git:
    repo: "{{ tfenv_repo }}"
    dest: "{{ tfenv_root }}"
    version: master
    recursive: false
    update: "{{ user_setup_install_latest_versions | bool }}"
  become: true
  become_user: "{{ devastation_user }}"

- name: Add pyenv initialization to profile
  ansible.builtin.blockinfile:
    path: "{{ user_setup_shell_profile }}"
    create: true
    owner: "{{ devastation_user }}"
    group: "{{ devastation_user }}"
    mode: "0644"
    marker: "# {mark} DEVASTATION PYENV"
    block: |
      export PYENV_ROOT="$HOME/.pyenv"
      if [ -d "$PYENV_ROOT/bin" ]; then
        export PATH="$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init -)"
      fi

- name: Add rbenv initialization to profile
  ansible.builtin.blockinfile:
    path: "{{ user_setup_shell_profile }}"
    create: true
    owner: "{{ devastation_user }}"
    group: "{{ devastation_user }}"
    mode: "0644"
    marker: "# {mark} DEVASTATION RBENV"
    block: |
      export RBENV_ROOT="$HOME/.rbenv"
      if [ -d "$RBENV_ROOT/bin" ]; then
        export PATH="$RBENV_ROOT/bin:$PATH"
        eval "$(rbenv init -)"
      fi

- name: Add nvm initialization to profile
  ansible.builtin.blockinfile:
    path: "{{ user_setup_shell_profile }}"
    create: true
    owner: "{{ devastation_user }}"
    group: "{{ devastation_user }}"
    mode: "0644"
    marker: "# {mark} DEVASTATION NVM"
    block: |
      export NVM_DIR="$HOME/.nvm"
      if [ -s "$NVM_DIR/nvm.sh" ]; then
        . "$NVM_DIR/nvm.sh"
      fi

- name: Add tfenv initialization to profile
  ansible.builtin.blockinfile:
    path: "{{ user_setup_shell_profile }}"
    create: true
    owner: "{{ devastation_user }}"
    group: "{{ devastation_user }}"
    mode: "0644"
    marker: "# {mark} DEVASTATION TFENV"
    block: |
      export TFENV_ROOT="$HOME/.tfenv"
      if [ -d "$TFENV_ROOT/bin" ]; then
        export PATH="$TFENV_ROOT/bin:$PATH"
      fi

- name: Add package cache defaults to profile
  ansible.builtin.blockinfile:
    path: "{{ user_setup_shell_profile }}"
    create: true
    owner: "{{ devastation_user }}"
    group: "{{ devastation_user }}"
    mode: "0644"
    marker: "# {mark} DEVASTATION PACKAGE MIRRORS"
    block: |
      export NPM_CONFIG_REGISTRY="{{ user_setup_npm_registry }}"
      export PIP_INDEX_URL="{{ user_setup_pip_index_url }}"
      export GEM_SOURCE="{{ user_setup_gem_source }}"
  when: user_setup_configure_package_mirrors

- name: Add Docker registry helpers to profile
  ansible.builtin.blockinfile:
    path: "{{ user_setup_shell_profile }}"
    create: true
    owner: "{{ devastation_user }}"
    group: "{{ devastation_user }}"
    mode: "0644"
    marker: "# {mark} DEVASTATION DOCKER REGISTRY"
    block: |
      export DEVASTATION_DOCKER_REGISTRY="registry.{{ devastation_domain }}"

      devastation_docker_registry_image() {
        if [ "$#" -lt 1 ]; then
          printf 'usage: devastation_docker_registry_image IMAGE[:TAG]\n' >&2
          return 2
        fi

        case "$1" in
          "$DEVASTATION_DOCKER_REGISTRY"/*)
            printf '%s\n' "$1"
            ;;
          */*)
            local first="${1%%/*}"
            case "$first" in
              *.*|*:*|localhost)
                printf '%s/%s\n' "$DEVASTATION_DOCKER_REGISTRY" "${1#*/}"
                ;;
              *)
                printf '%s/%s\n' "$DEVASTATION_DOCKER_REGISTRY" "$1"
                ;;
            esac
            ;;
          *)
            printf '%s/%s\n' "$DEVASTATION_DOCKER_REGISTRY" "$1"
            ;;
        esac
      }

      dtag() {
        if [ "$#" -lt 1 ]; then
          printf 'usage: dtag IMAGE[:TAG] [REGISTRY_IMAGE[:TAG]]\n' >&2
          return 2
        fi

        local source="$1"
        local target="${2:-$(devastation_docker_registry_image "$source")}"
        docker tag "$source" "$target"
        printf '%s\n' "$target"
      }

      dpush() {
        if [ "$#" -lt 1 ]; then
          printf 'usage: dpush IMAGE[:TAG] [REGISTRY_IMAGE[:TAG]]\n' >&2
          return 2
        fi

        local source="$1"
        local target="${2:-$(devastation_docker_registry_image "$source")}"
        if [ "$source" != "$target" ]; then
          docker tag "$source" "$target"
        fi
        docker push "$target"
      }

- name: Resolve latest stable CPython version
  ansible.builtin.shell: |
    set -euo pipefail
    "{{ pyenv_root }}/bin/pyenv" install --list \
      | sed -nE 's/^[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
      | sort -V \
      | tail -n 1
  args:
    executable: /bin/bash
  register: latest_python_version
  changed_when: false
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Check active pyenv global version
  ansible.builtin.command:
    argv:
      - "{{ pyenv_root }}/bin/pyenv"
      - global
  register: active_python_version
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Assert latest stable CPython version resolved
  ansible.builtin.assert:
    that:
      - latest_python_version.stdout | length > 0
    fail_msg: "Unable to resolve the latest stable CPython version from pyenv."
  when: user_setup_install_latest_versions

- name: Install latest stable CPython version
  ansible.builtin.command:
    argv:
      - "{{ pyenv_root }}/bin/pyenv"
      - install
      - -s
      - "{{ latest_python_version.stdout }}"
  args:
    creates: "{{ pyenv_root }}/versions/{{ latest_python_version.stdout }}/bin/python"
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Set latest stable CPython as pyenv global
  ansible.builtin.command:
    argv:
      - "{{ pyenv_root }}/bin/pyenv"
      - global
      - "{{ latest_python_version.stdout }}"
  changed_when: active_python_version.stdout | default('') != latest_python_version.stdout
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Configure pip to use PyPI cache
  ansible.builtin.shell: |
    set -euo pipefail
    export PYENV_ROOT="{{ pyenv_root }}"
    export PATH="{{ pyenv_root }}/bin:$PATH"
    current_index="$("{{ pyenv_root }}/bin/pyenv" exec python -m pip config get global.index-url 2>/dev/null || true)"
    "{{ pyenv_root }}/bin/pyenv" exec python -m pip config set global.index-url "{{ user_setup_pip_index_url }}"
    test "$current_index" != "{{ user_setup_pip_index_url }}"
  args:
    executable: /bin/bash
  register: pip_mirror_config
  changed_when: pip_mirror_config.rc == 0
  failed_when: pip_mirror_config.rc not in [0, 1]
  become: true
  become_user: "{{ devastation_user }}"
  when:
    - user_setup_install_latest_versions
    - user_setup_configure_package_mirrors

- name: Resolve latest stable Ruby version
  ansible.builtin.shell: |
    set -euo pipefail
    export RBENV_ROOT="{{ rbenv_root }}"
    export PATH="{{ rbenv_root }}/bin:$PATH"
    eval "$("{{ rbenv_root }}/bin/rbenv" init - bash)"
    "{{ rbenv_root }}/bin/rbenv" install -l \
      | sed -nE 's/^([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
      | sort -V \
      | tail -n 1
  args:
    executable: /bin/bash
  register: latest_ruby_version
  changed_when: false
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Assert latest stable Ruby version resolved
  ansible.builtin.assert:
    that:
      - latest_ruby_version.stdout | length > 0
    fail_msg: "Unable to resolve the latest stable Ruby version from rbenv/ruby-build."
  when: user_setup_install_latest_versions

- name: Check active rbenv global version
  ansible.builtin.command:
    argv:
      - "{{ rbenv_root }}/bin/rbenv"
      - global
  register: active_ruby_version
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Install latest stable Ruby version
  ansible.builtin.shell: |
    set -euo pipefail
    export RBENV_ROOT="{{ rbenv_root }}"
    export PATH="{{ rbenv_root }}/bin:$PATH"
    eval "$("{{ rbenv_root }}/bin/rbenv" init - bash)"
    "{{ rbenv_root }}/bin/rbenv" install -s "{{ latest_ruby_version.stdout }}"
  args:
    executable: /bin/bash
    creates: "{{ rbenv_root }}/versions/{{ latest_ruby_version.stdout }}/bin/ruby"
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Set latest stable Ruby as rbenv global
  ansible.builtin.command:
    argv:
      - "{{ rbenv_root }}/bin/rbenv"
      - global
      - "{{ latest_ruby_version.stdout }}"
  changed_when: active_ruby_version.stdout | default('') != latest_ruby_version.stdout
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Configure RubyGems and Bundler to use Gemstash cache
  ansible.builtin.shell: |
    set -euo pipefail
    export RBENV_ROOT="{{ rbenv_root }}"
    export PATH="{{ rbenv_root }}/bin:$PATH"
    eval "$("{{ rbenv_root }}/bin/rbenv" init - bash)"

    gem sources --add "{{ user_setup_gem_source }}"
    gem sources --remove https://rubygems.org/ || true

    if command -v bundle >/dev/null 2>&1; then
      bundle config set mirror.https://rubygems.org "{{ user_setup_gem_source }}"
    fi
  args:
    executable: /bin/bash
  register: ruby_mirror_config
  changed_when: >-
    'added to sources' in ruby_mirror_config.stdout
    or 'You are replacing' in ruby_mirror_config.stderr
  become: true
  become_user: "{{ devastation_user }}"
  when:
    - user_setup_install_latest_versions
    - user_setup_configure_package_mirrors

- name: Resolve latest Node.js LTS version
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="{{ nvm_root }}"
    . "$NVM_DIR/nvm.sh"
    nvm version-remote --lts
  args:
    executable: /bin/bash
  register: latest_node_version
  changed_when: false
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Assert latest Node.js LTS version resolved
  ansible.builtin.assert:
    that:
      - latest_node_version.stdout | length > 0
      - latest_node_version.stdout != "N/A"
    fail_msg: "Unable to resolve the latest Node.js LTS version from nvm."
  when: user_setup_install_latest_versions

- name: Check active nvm default version
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="{{ nvm_root }}"
    . "$NVM_DIR/nvm.sh"
    nvm version default
  args:
    executable: /bin/bash
  register: active_node_version
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Install latest Node.js LTS version
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="{{ nvm_root }}"
    . "$NVM_DIR/nvm.sh"
    nvm install --lts
    nvm alias default "{{ latest_node_version.stdout }}"
  args:
    executable: /bin/bash
    creates: "{{ nvm_root }}/versions/node/{{ latest_node_version.stdout }}/bin/node"
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Set latest Node.js LTS as nvm default
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="{{ nvm_root }}"
    . "$NVM_DIR/nvm.sh"
    nvm alias default "{{ latest_node_version.stdout }}"
  args:
    executable: /bin/bash
  changed_when: active_node_version.stdout | default('') != latest_node_version.stdout
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Configure npm to use Verdaccio cache
  ansible.builtin.shell: |
    set -euo pipefail
    export NVM_DIR="{{ nvm_root }}"
    . "$NVM_DIR/nvm.sh"
    nvm use default
    current_registry="$(npm config get registry)"
    npm config set registry "{{ user_setup_npm_registry }}"
    test "$current_registry" != "{{ user_setup_npm_registry }}"
  args:
    executable: /bin/bash
  register: npm_mirror_config
  changed_when: npm_mirror_config.rc == 0
  failed_when: npm_mirror_config.rc not in [0, 1]
  become: true
  become_user: "{{ devastation_user }}"
  when:
    - user_setup_install_latest_versions
    - user_setup_configure_package_mirrors

- name: Resolve latest stable Terraform version
  ansible.builtin.command:
    argv:
      - "{{ tfenv_root }}/bin/tfenv"
      - list-remote
  register: terraform_remote_versions
  changed_when: false
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Set latest stable Terraform version fact
  ansible.builtin.set_fact:
    latest_terraform_version: "{{ terraform_remote_versions.stdout_lines | reject('search', '-') | first }}"
  when: user_setup_install_latest_versions

- name: Assert latest stable Terraform version resolved
  ansible.builtin.assert:
    that:
      - latest_terraform_version | length > 0
    fail_msg: "Unable to resolve the latest stable Terraform version from tfenv."
  when: user_setup_install_latest_versions

- name: Check active tfenv version
  ansible.builtin.command:
    argv:
      - "{{ tfenv_root }}/bin/tfenv"
      - version-name
  register: active_terraform_version
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Install latest stable Terraform version
  ansible.builtin.command:
    argv:
      - "{{ tfenv_root }}/bin/tfenv"
      - install
      - "{{ latest_terraform_version }}"
  args:
    creates: "{{ tfenv_root }}/versions/{{ latest_terraform_version }}/terraform"
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions

- name: Set latest stable Terraform as tfenv global
  ansible.builtin.command:
    argv:
      - "{{ tfenv_root }}/bin/tfenv"
      - use
      - "{{ latest_terraform_version }}"
  changed_when: active_terraform_version.stdout | default('') != latest_terraform_version
  become: true
  become_user: "{{ devastation_user }}"
  when: user_setup_install_latest_versions
