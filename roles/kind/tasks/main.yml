---
- name: Check kind binary
  ansible.builtin.stat:
    path: /usr/local/bin/kind
  register: kind_binary

- name: Install kind when missing
  ansible.builtin.get_url:
    url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
    dest: /usr/local/bin/kind
    mode: "0755"
  when: not kind_binary.stat.exists

- name: Check kubectl binary
  ansible.builtin.stat:
    path: /usr/local/bin/kubectl
  register: kubectl_binary

- name: Install kubectl when missing
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"
  when: not kubectl_binary.stat.exists

- name: Create KIND config directory
  ansible.builtin.file:
    path: "{{ devastation_paths.kind }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write KIND cluster config
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/kind-config.yml.j2"
    dest: "{{ devastation_paths.kind }}/kind-config.yml"
    owner: root
    group: root
    mode: "0644"

- name: Check for existing KIND cluster
  ansible.builtin.command: "kind get clusters"
  register: kind_clusters
  changed_when: false

- name: Create KIND cluster
  ansible.builtin.command: "kind create cluster --name {{ kind_cluster_name }} --config {{ devastation_paths.kind }}/kind-config.yml --image {{ kind_node_image }}"
  when: "kind_cluster_name not in kind_clusters.stdout_lines"

- name: Get KIND nodes
  ansible.builtin.command: "kind get nodes --name {{ kind_cluster_name }}"
  register: kind_nodes
  changed_when: false

- name: Ensure target user kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ kind_user_kubeconfig | dirname }}"
    state: directory
    owner: "{{ devastation_user }}"
    group: "{{ devastation_user }}"
    mode: "0700"
  when: kind_configure_user_kubeconfig | bool

- name: Check target user kubeconfig context
  ansible.builtin.command:
    argv:
      - kubectl
      - config
      - current-context
      - --kubeconfig
      - "{{ kind_user_kubeconfig }}"
  register: kind_user_kubeconfig_context
  changed_when: false
  failed_when: false
  when: kind_configure_user_kubeconfig | bool

- name: Export KIND kubeconfig for target user
  ansible.builtin.command:
    argv:
      - kind
      - export
      - kubeconfig
      - --name
      - "{{ kind_cluster_name }}"
      - --kubeconfig
      - "{{ kind_user_kubeconfig }}"
  register: kind_user_kubeconfig_export
  changed_when: kind_user_kubeconfig_context.stdout | default('') != 'kind-' ~ kind_cluster_name
  when: kind_configure_user_kubeconfig | bool

- name: Ensure target user owns kubeconfig
  ansible.builtin.file:
    path: "{{ kind_user_kubeconfig }}"
    state: file
    owner: "{{ devastation_user }}"
    group: "{{ devastation_user }}"
    mode: "0600"
  when: kind_configure_user_kubeconfig | bool

- name: Connect KIND nodes to devastation network
  ansible.builtin.shell: |
    set -eu
    node="{{ item }}"
    control_plane="{{ kind_cluster_name }}-control-plane"
    current="$(docker inspect "$node" | jq -r '.[0].NetworkSettings.Networks.devastation.IPAddress // ""')"

    if [ "$node" = "$control_plane" ]; then
      wanted="{{ devastation_subnets.kind }}"
      if [ "$current" = "$wanted" ]; then
        echo "already-static"
        exit 0
      fi
      if [ -n "$current" ]; then
        docker network disconnect devastation "$node"
      fi
      docker network connect --ip "$wanted" devastation "$node"
      echo "changed"
      exit 0
    fi

    if [ -n "$current" ]; then
      echo "already-connected"
      exit 0
    fi
    docker network connect devastation "$node"
    echo "changed"
  loop: "{{ kind_nodes.stdout_lines }}"
  register: kind_network_connect
  changed_when: "'changed' in kind_network_connect.stdout"

- name: Configure registry trust inside KIND nodes
  ansible.builtin.shell: |
    set -eu
    node="{{ item }}"
    docker exec "$node" mkdir -p /etc/containerd/certs.d/registry.{{ devastation_domain }}
    docker cp {{ devastation_paths.ca }}/root-ca.crt "$node":/etc/containerd/certs.d/registry.{{ devastation_domain }}/ca.crt
    docker exec "$node" sh -c 'printf "%s\n" \
      "server = \"https://registry.{{ devastation_domain }}\"" \
      "" \
      "[host.\"https://registry.{{ devastation_domain }}\"]" \
      "  capabilities = [\"pull\", \"resolve\"]" \
      "  ca = \"/etc/containerd/certs.d/registry.{{ devastation_domain }}/ca.crt\"" \
      > /etc/containerd/certs.d/registry.{{ devastation_domain }}/hosts.toml'
    docker exec "$node" systemctl restart containerd
  loop: "{{ kind_nodes.stdout_lines }}"
  changed_when: true

- name: Add Helm repository for cert-manager
  ansible.builtin.command:
    argv:
      - helm
      - repo
      - add
      - jetstack
      - "{{ cert_manager_helm_repo }}"
      - --force-update
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Add Helm repository for Istio
  ansible.builtin.command:
    argv:
      - helm
      - repo
      - add
      - istio
      - "{{ istio_helm_repo }}"
      - --force-update
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Add Helm repository for MetalLB
  ansible.builtin.command:
    argv:
      - helm
      - repo
      - add
      - metallb
      - "{{ metallb_helm_repo }}"
      - --force-update
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Refresh Helm repositories
  ansible.builtin.command:
    argv:
      - helm
      - repo
      - update
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Install cert-manager for operator webhooks
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - cert-manager
      - jetstack/cert-manager
      - --namespace
      - cert-manager
      - --create-namespace
      - --set
      - crds.enabled=true
      - --wait
      - --timeout
      - 5m
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Install Istio base chart
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - istio-base
      - istio/base
      - --version
      - "{{ istio_version }}"
      - --namespace
      - istio-system
      - --create-namespace
      - --wait
      - --timeout
      - 5m
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Install Istio control plane
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - istiod
      - istio/istiod
      - --version
      - "{{ istio_version }}"
      - --namespace
      - istio-system
      - --wait
      - --timeout
      - 10m
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Install Istio ingress gateway
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - "{{ istio_gateway_name }}"
      - istio/gateway
      - --version
      - "{{ istio_version }}"
      - --namespace
      - istio-system
      - --wait
      - --timeout
      - 10m
      - --set
      - "service.type={{ istio_gateway_service_type }}"
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Adopt existing cluster-scoped MetalLB resources into Helm
  ansible.builtin.command:
    argv:
      - kubectl
      - label
      - "{{ item }}"
      - app.kubernetes.io/managed-by=Helm
      - --overwrite
  loop:
    - customresourcedefinition/bfdprofiles.metallb.io
    - customresourcedefinition/bgpadvertisements.metallb.io
    - customresourcedefinition/bgppeers.metallb.io
    - customresourcedefinition/communities.metallb.io
    - customresourcedefinition/ipaddresspools.metallb.io
    - customresourcedefinition/l2advertisements.metallb.io
    - customresourcedefinition/servicel2statuses.metallb.io
    - clusterrole/metallb-system:controller
    - clusterrole/metallb-system:speaker
    - clusterrolebinding/metallb-system:controller
    - clusterrolebinding/metallb-system:speaker
    - validatingwebhookconfiguration/metallb-webhook-configuration
  register: metallb_helm_adoption_labels
  changed_when: "'not labeled' not in metallb_helm_adoption_labels.stdout"
  failed_when:
    - metallb_helm_adoption_labels.rc != 0
    - "'not found' not in metallb_helm_adoption_labels.stderr"
  when: kind_install_platform_addons | bool

- name: Annotate existing cluster-scoped MetalLB resources for Helm
  ansible.builtin.command:
    argv:
      - kubectl
      - annotate
      - "{{ item }}"
      - meta.helm.sh/release-name=metallb
      - meta.helm.sh/release-namespace=metallb-system
      - --overwrite
  loop:
    - customresourcedefinition/bfdprofiles.metallb.io
    - customresourcedefinition/bgpadvertisements.metallb.io
    - customresourcedefinition/bgppeers.metallb.io
    - customresourcedefinition/communities.metallb.io
    - customresourcedefinition/ipaddresspools.metallb.io
    - customresourcedefinition/l2advertisements.metallb.io
    - customresourcedefinition/servicel2statuses.metallb.io
    - clusterrole/metallb-system:controller
    - clusterrole/metallb-system:speaker
    - clusterrolebinding/metallb-system:controller
    - clusterrolebinding/metallb-system:speaker
    - validatingwebhookconfiguration/metallb-webhook-configuration
  register: metallb_helm_adoption_annotations
  changed_when: "'not annotated' not in metallb_helm_adoption_annotations.stdout"
  failed_when:
    - metallb_helm_adoption_annotations.rc != 0
    - "'not found' not in metallb_helm_adoption_annotations.stderr"
  when: kind_install_platform_addons | bool

- name: Install MetalLB
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - metallb
      - metallb/metallb
      - --version
      - "{{ metallb_version }}"
      - --namespace
      - metallb-system
      - --create-namespace
      - --wait
      - --timeout
      - 5m
      - --force-conflicts
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Render MetalLB edge configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/metallb-edge.yml.j2"
    dest: "{{ devastation_paths.kind }}/metallb-edge.yml"
    owner: root
    group: root
    mode: "0644"
  when: kind_install_platform_addons | bool

- name: Apply MetalLB edge configuration
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - --filename
      - "{{ devastation_paths.kind }}/metallb-edge.yml"
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Render shared Istio edge configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/istio-edge.yml.j2"
    dest: "{{ devastation_paths.kind }}/istio-edge.yml"
    owner: root
    group: root
    mode: "0644"
  when: kind_install_platform_addons | bool

- name: Apply shared Istio edge configuration
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - --filename
      - "{{ devastation_paths.kind }}/istio-edge.yml"
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Ensure Argo CD namespace exists
  ansible.builtin.command:
    argv:
      - kubectl
      - create
      - namespace
      - argocd
  register: argocd_namespace
  changed_when: argocd_namespace.rc == 0
  failed_when:
    - argocd_namespace.rc != 0
    - "'AlreadyExists' not in argocd_namespace.stderr"
  when: kind_install_platform_addons | bool

- name: Install Argo CD
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -n
      - argocd
      - --server-side
      - --force-conflicts
      - -f
      - "{{ argocd_manifest_url }}"
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Install OpenTelemetry Operator
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - --server-side
      - --force-conflicts
      - -f
      - "{{ otel_operator_manifest_url }}"
  changed_when: true
  when: kind_install_platform_addons | bool

- name: Wait for Istio control plane
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - istio-system
      - rollout
      - status
      - deployment/istiod
      - --timeout=300s
  changed_when: false
  when: kind_install_platform_addons | bool

- name: Wait for Istio ingress gateway
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - istio-system
      - rollout
      - status
      - "deployment/{{ istio_gateway_name }}"
      - --timeout=300s
  changed_when: false
  when: kind_install_platform_addons | bool

- name: Wait for Argo CD API server
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - argocd
      - rollout
      - status
      - deployment/argocd-server
      - --timeout=300s
  changed_when: false
  when: kind_install_platform_addons | bool

- name: Wait for OpenTelemetry Operator
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - opentelemetry-operator-system
      - rollout
      - status
      - deployment/opentelemetry-operator-controller-manager
      - --timeout=300s
  changed_when: false
  when: kind_install_platform_addons | bool

- name: Sync extra leaf certificates into Istio Gateway namespace
  ansible.builtin.shell: |
    set -euo pipefail
    host="{{ item }}"
    secret="${host%%.*}-tls"

    kubectl --kubeconfig "{{ kind_user_kubeconfig }}" create secret tls "$secret" \
      --namespace "{{ kind_istio_tls_secret_namespace }}" \
      --cert "{{ devastation_paths.certs }}/${host}/tls.crt" \
      --key "{{ devastation_paths.certs }}/${host}/tls.key" \
      --dry-run=client \
      --output=yaml \
    | kubectl --kubeconfig "{{ kind_user_kubeconfig }}" label \
        --filename - \
        --local \
        --output=yaml \
        app.kubernetes.io/part-of=sectorfour-mirror \
    | kubectl --kubeconfig "{{ kind_user_kubeconfig }}" apply --filename -
  args:
    executable: /bin/bash
  loop: "{{ ca_extra_leaf_certificates }}"
  changed_when: "'configured' in istio_extra_leaf_cert_sync.stdout or 'created' in istio_extra_leaf_cert_sync.stdout"
  register: istio_extra_leaf_cert_sync
  when:
    - kind_install_platform_addons | bool
    - kind_sync_extra_leaf_certs_to_istio | bool
    - ca_extra_leaf_certificates | length > 0
