---
- name: Create apt cache directory
  ansible.builtin.file:
    path: "{{ devastation_paths.apt_cache }}/data"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure transparent apt cache frontend
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/apt-cache-transparent-nginx.conf.j2"
    dest: "{{ devastation_paths.apt_cache }}/transparent-nginx.conf"
    owner: root
    group: root
    mode: "0644"
  when: apt_cache_transparent_enabled | bool

- name: Configure apt cache safety overrides
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/apt-cache-devastation.conf.j2"
    dest: "{{ devastation_paths.apt_cache }}/devastation.conf"
    owner: root
    group: root
    mode: "0644"

- name: Start apt cache service
  community.docker.docker_compose_v2:
    project_src: "{{ devastation_paths.compose }}"
    services: "{{ ['apt-cache'] + (['apt-cache-transparent'] if apt_cache_transparent_enabled else []) }}"
    state: present

- name: Wait for apt cache service
  ansible.builtin.wait_for:
    host: "apt-cache.{{ devastation_domain }}"
    port: "{{ apt_cache_port }}"
    timeout: 60

- name: Configure host apt to use local cache
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/apt-devastation-proxy.conf.j2"
    dest: /etc/apt/apt.conf.d/01devastation-proxy
    owner: root
    group: root
    mode: "0644"
  when: apt_cache_configure_host

- name: Wait for transparent apt cache frontend
  ansible.builtin.wait_for:
    host: "{{ devastation_subnets.apt_cache_transparent }}"
    port: "{{ apt_cache_transparent_port }}"
    timeout: 60
  when: apt_cache_transparent_enabled | bool
