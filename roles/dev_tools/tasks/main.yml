---
- name: Check Helm binary
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_binary

- name: Create Helm archive directory
  ansible.builtin.file:
    path: /tmp/devastation-helm
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not helm_binary.stat.exists

- name: Download Helm archive
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: "/tmp/devastation-helm/helm-{{ helm_version }}-linux-amd64.tar.gz"
    mode: "0644"
  when: not helm_binary.stat.exists

- name: Extract Helm archive
  ansible.builtin.unarchive:
    src: "/tmp/devastation-helm/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /tmp/devastation-helm
    remote_src: true
  when: not helm_binary.stat.exists

- name: Install Helm binary
  ansible.builtin.copy:
    src: /tmp/devastation-helm/linux-amd64/helm
    dest: /usr/local/bin/helm
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when: not helm_binary.stat.exists

- name: Check K9s binary
  ansible.builtin.stat:
    path: /usr/bin/k9s
  register: k9s_binary

- name: Download K9s package
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/download/{{ k9s_version }}/k9s_linux_amd64.deb"
    dest: "/tmp/k9s_linux_amd64_{{ k9s_version }}.deb"
    mode: "0644"
  when: not k9s_binary.stat.exists

- name: Install K9s package
  ansible.builtin.apt:
    deb: "/tmp/k9s_linux_amd64_{{ k9s_version }}.deb"
  when: not k9s_binary.stat.exists

- name: Check Lazydocker binary
  ansible.builtin.stat:
    path: /usr/local/bin/lazydocker
  register: lazydocker_binary

- name: Create Lazydocker archive directory
  ansible.builtin.file:
    path: /tmp/devastation-lazydocker
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not lazydocker_binary.stat.exists

- name: Download Lazydocker archive
  ansible.builtin.get_url:
    url: "https://github.com/jesseduffield/lazydocker/releases/download/v{{ lazydocker_version }}/lazydocker_{{ lazydocker_version }}_Linux_x86_64.tar.gz"
    dest: "/tmp/devastation-lazydocker/lazydocker_{{ lazydocker_version }}_Linux_x86_64.tar.gz"
    mode: "0644"
  when: not lazydocker_binary.stat.exists

- name: Extract Lazydocker archive
  ansible.builtin.unarchive:
    src: "/tmp/devastation-lazydocker/lazydocker_{{ lazydocker_version }}_Linux_x86_64.tar.gz"
    dest: /tmp/devastation-lazydocker
    remote_src: true
  when: not lazydocker_binary.stat.exists

- name: Install Lazydocker binary
  ansible.builtin.copy:
    src: /tmp/devastation-lazydocker/lazydocker
    dest: /usr/local/bin/lazydocker
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when: not lazydocker_binary.stat.exists

- name: Check Trivy binary
  ansible.builtin.stat:
    path: /usr/bin/trivy
  register: trivy_binary

- name: Download Trivy package
  ansible.builtin.get_url:
    url: "https://github.com/aquasecurity/trivy/releases/download/v{{ trivy_version }}/trivy_{{ trivy_version }}_Linux-64bit.deb"
    dest: "/tmp/trivy_{{ trivy_version }}_Linux-64bit.deb"
    mode: "0644"
  when: not trivy_binary.stat.exists

- name: Install Trivy package
  ansible.builtin.apt:
    deb: "/tmp/trivy_{{ trivy_version }}_Linux-64bit.deb"
  when: not trivy_binary.stat.exists

- name: Assert official creative application architecture support
  ansible.builtin.assert:
    that:
      - ansible_architecture == "x86_64"
    fail_msg: "Official creative application installers currently support x86_64 hosts only."
  when: official_creative_apps_enabled | bool

- name: Install AppImage runtime support
  ansible.builtin.apt:
    name: libfuse2t64
    state: present
    lock_timeout: "{{ apt_lock_timeout | int }}"
  when: official_creative_apps_enabled | bool

- name: Resolve latest official OBS Studio Ubuntu package
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      release="$(curl -fsSL {{ obs_studio_release_api | quote }})"
      version="$(jq -r '.tag_name' <<<"$release")"
      asset="OBS-Studio-${version}-Ubuntu-{{ obs_studio_ubuntu_release }}-x86_64.deb"
      url="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url' <<<"$release")"
      if [[ -z "$version" || "$version" == "null" || -z "$url" || "$url" == "null" ]]; then
        echo "Unable to resolve the official OBS Studio ${asset}" >&2
        exit 1
      fi
      printf '%s\n%s\n' "$version" "$url"
  args:
    executable: /bin/bash
  register: obs_studio_latest_release
  changed_when: false
  when: obs_studio_install_enabled | bool

- name: Download latest official OBS Studio package
  ansible.builtin.get_url:
    url: "{{ obs_studio_latest_release.stdout_lines[1] }}"
    dest: "/tmp/OBS-Studio-{{ obs_studio_latest_release.stdout_lines[0] }}-Ubuntu-{{ obs_studio_ubuntu_release }}-x86_64.deb"
    mode: "0644"
  when: obs_studio_install_enabled | bool

- name: Install latest official OBS Studio package
  ansible.builtin.apt:
    deb: "/tmp/OBS-Studio-{{ obs_studio_latest_release.stdout_lines[0] }}-Ubuntu-{{ obs_studio_ubuntu_release }}-x86_64.deb"
    lock_timeout: "{{ apt_lock_timeout | int }}"
  when: obs_studio_install_enabled | bool

- name: Resolve latest official GIMP x86_64 AppImage
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      downloads="$(curl -fsSL {{ gimp_download_page_url | quote }})"
      url="$(
        grep -m 1 -oP '(?<=href="//)download\.gimp\.org/[^"]+-x86_64\.AppImage(?=")' <<<"$downloads"
      )"
      version="$(sed -E 's#^.*/GIMP-([0-9.]+)-x86_64\.AppImage$#\1#' <<<"$url")"
      if [[ -z "$url" || "$version" == "$url" ]]; then
        echo "Unable to resolve the latest official GIMP x86_64 AppImage" >&2
        exit 1
      fi
      printf '%s\nhttps://%s\n' "$version" "$url"
  args:
    executable: /bin/bash
  register: gimp_latest_release
  changed_when: false
  when: gimp_install_enabled | bool

- name: Resolve latest official Krita x86_64 AppImage
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      base="{{ krita_release_base_url }}"
      base="${base%/}"
      releases="$(curl -fsSL "${base}/")"
      version="$(
        grep -oP 'href="\K[0-9]+(\.[0-9]+)+(?=/")' <<<"$releases" \
          | sort -Vu \
          | tail -n 1
      )"
      release_files="$(curl -fsSL "${base}/${version}/")"
      archive="$(
        grep -oP 'href="\Kkrita-[^"]+-x86_64\.AppImage(?=")' <<<"$release_files" \
          | sort -u
      )"
      if [[ -z "$version" || -z "$archive" ]]; then
        echo "Unable to resolve the latest official Krita x86_64 AppImage" >&2
        exit 1
      fi
      printf '%s\n%s/%s/%s\n' "$version" "$base" "$version" "$archive"
  args:
    executable: /bin/bash
  register: krita_latest_release
  changed_when: false
  when: krita_install_enabled | bool

- name: Resolve latest official Inkscape x86_64 AppImage
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      home="{{ inkscape_homepage_url }}"
      home="${home%/}"
      homepage="$(curl -fsSL "${home}/")"
      version="$(
        grep -oP '/release/inkscape-\K[0-9]+(\.[0-9]+)+(?=/)' <<<"$homepage" \
          | sort -Vu \
          | tail -n 1
      )"
      page="${home}/release/inkscape-${version}/gnulinux/appimage/dl/"
      downloads="$(curl -fsSL "$page")"
      artifact="$(
        grep -m 1 -oP '/gallery/item/[0-9]+/[^"]+\.AppImage' <<<"$downloads"
      )"
      if [[ -z "$version" || -z "$artifact" ]]; then
        echo "Unable to resolve the latest official Inkscape x86_64 AppImage" >&2
        exit 1
      fi
      printf '%s\n%s%s\n' "$version" "$home" "$artifact"
  args:
    executable: /bin/bash
  register: inkscape_latest_release
  changed_when: false
  when: inkscape_install_enabled | bool

- name: Install latest official creative application AppImages
  ansible.builtin.include_tasks: install_official_appimage.yml
  loop:
    - name: GIMP
      slug: gimp
      command: gimp
      version: "{{ gimp_latest_release.stdout_lines[0] }}"
      url: "{{ gimp_latest_release.stdout_lines[1] }}"
      comment: Create and edit raster images
      categories: Graphics;2DGraphics;RasterGraphics;
      enabled: "{{ gimp_install_enabled }}"
    - name: Krita
      slug: krita
      command: krita
      version: "{{ krita_latest_release.stdout_lines[0] }}"
      url: "{{ krita_latest_release.stdout_lines[1] }}"
      comment: Digital painting and illustration
      categories: Graphics;2DGraphics;RasterGraphics;
      enabled: "{{ krita_install_enabled }}"
    - name: Inkscape
      slug: inkscape
      command: inkscape
      version: "{{ inkscape_latest_release.stdout_lines[0] }}"
      url: "{{ inkscape_latest_release.stdout_lines[1] }}"
      comment: Create and edit scalable vector graphics
      categories: Graphics;2DGraphics;VectorGraphics;
      enabled: "{{ inkscape_install_enabled }}"
  loop_control:
    loop_var: official_appimage
    label: "{{ official_appimage.name }}"
  when: official_appimage.enabled | bool

- name: Remove distro Blender package
  ansible.builtin.apt:
    name: blender
    state: absent
    purge: true
    lock_timeout: "{{ apt_lock_timeout | int }}"
  when:
    - blender_install_enabled | bool
    - blender_remove_distro_package | bool

- name: Create Blender install root
  ansible.builtin.file:
    path: "{{ blender_install_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: blender_install_enabled | bool

- name: Resolve latest official Blender Linux x64 release
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      base="{{ blender_official_release_base_url }}"
      base="${base%/}"
      release_dir="$(
        curl -fsSL "${base}/" \
          | grep -oP 'href="Blender[0-9]+\.[0-9]+/' \
          | sed -E 's/^href="(Blender[0-9]+\.[0-9]+)\/$/\1/' \
          | sort -Vu \
          | tail -n 1
      )"

      archive="$(
        curl -fsSL "${base}/${release_dir}/" \
          | grep -oP 'href="blender-[0-9]+\.[0-9]+\.[0-9]+-linux-x64\.tar\.xz"' \
          | sed -E 's/^href="([^"]+)"/\1/' \
          | sort -Vu \
          | tail -n 1
      )"

      if [[ -z "$release_dir" || -z "$archive" ]]; then
        echo "Unable to resolve latest Blender release from ${base}" >&2
        exit 1
      fi

      version="$(sed -E 's/^blender-([0-9]+\.[0-9]+\.[0-9]+)-linux-x64\.tar\.xz$/\1/' <<<"$archive")"
      printf '%s\n%s/%s/%s\n' "$version" "$base" "$release_dir" "$archive"
  args:
    executable: /bin/bash
  register: blender_latest_release
  changed_when: false
  when: blender_install_enabled | bool

- name: Read installed Blender version marker
  ansible.builtin.slurp:
    src: "{{ blender_install_root }}/VERSION"
  register: blender_installed_version_marker
  failed_when: false
  changed_when: false
  when: blender_install_enabled | bool

- name: Decide whether official Blender needs install
  ansible.builtin.set_fact:
    blender_latest_version: "{{ blender_latest_release.stdout_lines[0] }}"
    blender_latest_archive_url: "{{ blender_latest_release.stdout_lines[1] }}"
    blender_install_required: >-
      {{
        (blender_installed_version_marker.content is not defined)
        or ((blender_installed_version_marker.content | b64decode | trim) != blender_latest_release.stdout_lines[0])
      }}
  when: blender_install_enabled | bool

- name: Download latest official Blender archive
  ansible.builtin.get_url:
    url: "{{ blender_latest_archive_url }}"
    dest: "/tmp/blender-{{ blender_latest_version }}-linux-x64.tar.xz"
    mode: "0644"
  when:
    - blender_install_enabled | bool
    - blender_install_required | bool

- name: Remove previous official Blender tree
  ansible.builtin.file:
    path: "{{ blender_install_root }}/current"
    state: absent
  when:
    - blender_install_enabled | bool
    - blender_install_required | bool

- name: Extract latest official Blender
  ansible.builtin.unarchive:
    src: "/tmp/blender-{{ blender_latest_version }}-linux-x64.tar.xz"
    dest: "{{ blender_install_root }}"
    remote_src: true
    owner: root
    group: root
  when:
    - blender_install_enabled | bool
    - blender_install_required | bool

- name: Point Blender current symlink at latest release
  ansible.builtin.file:
    src: "{{ blender_install_root }}/blender-{{ blender_latest_version }}-linux-x64"
    dest: "{{ blender_install_root }}/current"
    state: link
    owner: root
    group: root
    force: true
  when: blender_install_enabled | bool

- name: Link Blender into PATH
  ansible.builtin.file:
    src: "{{ blender_install_root }}/current/blender"
    dest: "{{ blender_binary_path }}"
    state: link
    owner: root
    group: root
    force: true
  when: blender_install_enabled | bool

- name: Write installed Blender version marker
  ansible.builtin.copy:
    content: "{{ blender_latest_version }}\n"
    dest: "{{ blender_install_root }}/VERSION"
    owner: root
    group: root
    mode: "0644"
  when: blender_install_enabled | bool

- name: Check Vault CLI binary
  ansible.builtin.stat:
    path: /usr/local/bin/vault
  register: vault_cli_binary
  when: vault_cli_install_enabled

- name: Download Vault CLI archive
  ansible.builtin.get_url:
    url: "{{ vault_cli_release_url }}"
    dest: "{{ vault_cli_archive }}"
    mode: "0644"
  when:
    - vault_cli_install_enabled
    - not vault_cli_binary.stat.exists

- name: Extract Vault CLI
  ansible.builtin.unarchive:
    src: "{{ vault_cli_archive }}"
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when:
    - vault_cli_install_enabled
    - not vault_cli_binary.stat.exists

- name: Check Ghostty binary
  ansible.builtin.stat:
    path: /usr/bin/ghostty
  register: ghostty_binary
  when: ghostty_install_enabled

- name: Check Ghostty apt candidate
  ansible.builtin.command: apt-cache policy ghostty
  register: ghostty_apt_policy
  changed_when: false
  failed_when: false
  when:
    - ghostty_install_enabled
    - not ghostty_binary.stat.exists

- name: Install Ghostty from configured apt sources
  ansible.builtin.apt:
    name: ghostty
    state: present
    lock_timeout: "{{ apt_lock_timeout | int }}"
  when:
    - ghostty_install_enabled
    - not ghostty_binary.stat.exists
    - "'Candidate:' in ghostty_apt_policy.stdout"
    - "'Candidate: (none)' not in ghostty_apt_policy.stdout"

- name: Check Ghostty binary after apt install
  ansible.builtin.stat:
    path: /usr/bin/ghostty
  register: ghostty_binary_after_apt
  when:
    - ghostty_install_enabled
    - not ghostty_binary.stat.exists

- name: Resolve Ghostty community Debian package URL
  ansible.builtin.shell: |
    set -euo pipefail
    source /etc/os-release
    arch="$(dpkg --print-architecture)"

    case "$ID" in
      ubuntu|pop|tuxedo|neon)
        if [[ "$VERSION_ID" =~ ^(26.04|25.10|24.04)$ ]]; then
          suffix="${arch}_${VERSION_ID}"
        else
          echo "Unsupported Ubuntu-family release: ${VERSION_ID}" >&2
          exit 1
        fi
        ;;
      debian)
        if [[ "$VERSION_CODENAME" == "trixie" ]]; then
          suffix="${arch}_${VERSION_CODENAME}"
        else
          echo "Unsupported Debian release: ${VERSION_CODENAME}" >&2
          exit 1
        fi
        ;;
      *)
        echo "Unsupported Ghostty community package distribution: ${ID}" >&2
        exit 1
        ;;
    esac

    curl -fsSL "{{ ghostty_community_release_api }}" \
      | grep -oP "https://github.com/mkasberg/ghostty-ubuntu/releases/download/[^\"[:space:]/]+/ghostty_[^\"[:space:]_/]+_${suffix}\.deb" \
      | head -n 1
  args:
    executable: /bin/bash
  register: ghostty_community_deb_url
  changed_when: false
  when:
    - ghostty_install_enabled
    - ghostty_community_deb_enabled
    - not ghostty_binary.stat.exists
    - not (ghostty_binary_after_apt.stat.exists | default(false))

- name: Download Ghostty community Debian package
  ansible.builtin.get_url:
    url: "{{ ghostty_community_deb_url.stdout }}"
    dest: /tmp/devastation-ghostty.deb
    mode: "0644"
  when:
    - ghostty_install_enabled
    - ghostty_community_deb_enabled
    - ghostty_community_deb_url.stdout | default('') | length > 0

- name: Install Ghostty community Debian package
  ansible.builtin.apt:
    deb: /tmp/devastation-ghostty.deb
    lock_timeout: "{{ apt_lock_timeout | int }}"
  when:
    - ghostty_install_enabled
    - ghostty_community_deb_enabled
    - ghostty_community_deb_url.stdout | default('') | length > 0

- name: Download official Discord Debian package
  ansible.builtin.get_url:
    url: "{{ discord_deb_url }}"
    dest: "{{ discord_deb_archive }}"
    mode: "0644"
    force: true
  when: discord_install_enabled | bool

- name: Install official Discord Debian package
  ansible.builtin.apt:
    deb: "{{ discord_deb_archive }}"
    lock_timeout: "{{ apt_lock_timeout | int }}"
  when: discord_install_enabled | bool
