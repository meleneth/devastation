---
- name: Discover active NetworkManager IPv4 DNS servers
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - IP4.DNS
      - device
      - show
  register: dns_networkmanager_query
  check_mode: false
  changed_when: false
  failed_when: false

- name: Read host resolver configuration
  ansible.builtin.slurp:
    src: /etc/resolv.conf
  register: dns_resolv_conf

- name: Select safe discovered upstream DNS servers
  ansible.builtin.set_fact:
    dns_discovered_upstream_resolvers: >-
      {{
        (
          (dns_networkmanager_query.stdout | default('') |
            regex_findall('(?m)^([0-9]{1,3}(?:\.[0-9]{1,3}){3})$'))
          +
          (dns_resolv_conf.content | b64decode |
            regex_findall('(?m)^nameserver\s+([0-9]{1,3}(?:\.[0-9]{1,3}){3})(?:\s|$)'))
        )
        | unique
        | reject('match', '^127\.')
        | reject('equalto', devastation_subnets.dns)
        | list
      }}

- name: Choose configured or discovered upstream DNS servers
  ansible.builtin.set_fact:
    dns_effective_upstream_resolvers: >-
      {{
        (dns_upstream_resolvers | default([]) | length > 0)
        | ternary(dns_upstream_resolvers, dns_discovered_upstream_resolvers)
      }}

- name: Assert safe upstream DNS servers are available
  ansible.builtin.assert:
    that:
      - dns_effective_upstream_resolvers | length > 0
      - devastation_subnets.dns not in dns_effective_upstream_resolvers
      - dns_effective_upstream_resolvers | select('match', '^127\.') | list | length == 0
    fail_msg: >-
      No safe upstream DNS server was found. Set dns_upstream_resolvers to an
      explicit list of resolvers reachable from the Devastation Docker network.

- name: Report selected upstream DNS servers
  ansible.builtin.debug:
    msg: "Using upstream DNS servers: {{ dns_effective_upstream_resolvers | join(', ') }}"

- name: Create DNS directory
  ansible.builtin.file:
    path: "{{ devastation_paths.dns }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write CoreDNS Corefile
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/Corefile.j2"
    dest: "{{ devastation_paths.dns }}/Corefile"
    owner: root
    group: root
    mode: "0644"
  notify: Restart CoreDNS

- name: Write shared Docker Compose file
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/compose.yml.j2"
    dest: "{{ devastation_paths.compose }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start DNS service
  community.docker.docker_compose_v2:
    project_src: "{{ devastation_paths.compose }}"
    services:
      - dns
    state: present

- name: Add static deva.station names to host file
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} DEVASTATION DEVA.STATION HOSTS"
    block: |
      {% for record in devastation_dns_records %}
      {{ record.ip }} {{ record.name }}
      {% endfor %}
      {% for record in devastation_extra_dns_records %}
      {{ record.ip }} {{ record.name }}
      {% endfor %}
  when: dns_configure_hosts_file

- name: Gather service facts for resolver configuration
  ansible.builtin.service_facts:
  when: dns_configure_host_resolver

- name: Ensure systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: "{{ dns_systemd_resolved_dropin | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - dns_configure_host_resolver
    - "'systemd-resolved.service' in ansible_facts.services"

- name: Configure host resolver for deva.station
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/systemd-resolved-devastation.conf.j2"
    dest: "{{ dns_systemd_resolved_dropin }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - dns_configure_host_resolver
    - "'systemd-resolved.service' in ansible_facts.services"
  notify: Restart systemd-resolved

- name: Explain skipped systemd-resolved configuration
  ansible.builtin.debug:
    msg: "systemd-resolved is not available; /etc/hosts provides host resolution for deva.station names."
  when:
    - dns_configure_host_resolver
    - "'systemd-resolved.service' not in ansible_facts.services"
