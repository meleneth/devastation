<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>multifractory</title>
  <style>
    :root {
      --bg-color: #1a1c2c;
      --panel-color: #24263b;
      --link-color: #ffcc00;
      --text-color: #e6e6eb;
      --muted-color: #9da1bd;
      --border-color: #3d4163;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      background: #141625;
    }

    h1 {
      margin: 0;
      color: var(--link-color);
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .subtitle {
      margin: 0.35rem 0 0;
      color: var(--muted-color);
    }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr));
      gap: 1rem;
      padding: 1rem;
    }

    article {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--panel-color);
    }

    h2 {
      margin: 0;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.1;
    }

    h2 a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .site-favicon {
      display: inline-grid;
      place-items: center;
      flex: 0 0 1.25rem;
      width: 1.25rem;
      height: 1.25rem;
      border-radius: 3px;
      background: var(--border-color);
      color: var(--text-color);
      font-size: 0.75rem;
      line-height: 1;
    }

    .site-favicon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    iframe {
      display: block;
      width: 100%;
      height: 400px;
      border: 0;
      border-top: 1px solid var(--border-color);
      background: #fff;
    }

    .link-preview {
      display: grid;
      place-content: center;
      min-height: 400px;
      padding: 1.5rem;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    button {
      padding: 0.55rem 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--panel-color);
      color: var(--text-color);
      cursor: pointer;
    }

    button:hover {
      border-color: var(--link-color);
    }

    .count {
      color: var(--muted-color);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>multifractory</h1>
    <p class="subtitle">Your local services and sites, together in one page.</p>
    <div class="toolbar">
      <button id="reload" type="button">Reload all frames</button>
      <span class="count" id="count"></span>
    </div>
  </header>
  <main id="grid"></main>
  <script>
    const items = [
      { name: "avatars", link: "https://avatars.deva.station" },
      { name: "cnegng-docs", link: "https://cnegng-docs.deva.station" },
      { name: "devblog", link: "https://devblog.deva.station" },
      { name: "datawires", link: "https://datawires.deva.station", icon: "/icon.svg", deferIcon: true },
      { name: "gitlab", link: "https://gitlab.deva.station", embed: false },
      { name: "hiveware", link: "https://hiveware.deva.station" },
      { name: "js-melstars", link: "https://js-melstars.deva.station" },
      { name: "liz", link: "https://liz.deva.station" },
      { name: "naughtsea", link: "https://naughtsea.deva.station", icon: "/boat.ico" },
      { name: "pymaker", link: "https://pymaker.deva.station", icon: "/vite.svg" },
      { name: "rubellum", link: "https://rubellum.deva.station" },
      { name: "rubymaker", link: "https://rubymaker.deva.station", icon: "/vite.svg" },
      { name: "smlmaker", link: "https://smlmaker.deva.station", icon: "/vite.svg" },
      { name: "templator", link: "https://templator.deva.station" },
      { name: "vjn", link: "https://vjn.deva.station", icon: "/111.ico" },
      { name: "vuemaker", link: "https://vuemaker.deva.station" },
      { name: "webhaxe", link: "https://webhaxe.demo.deva.station" },
      { name: "whirred.deva.station", link: "https://whirred.deva.station" },
      { name: "whirred.io", link: "https://whirred.io" }
    ];

    const grid = document.getElementById("grid");
    document.getElementById("count").textContent = `${items.length} services`;

    function loadFrame(frame, url) {
      frame.src = "about:blank";
      requestAnimationFrame(() => {
        frame.src = url;
      });
    }

    for (const item of items) {
      const card = document.createElement("article");
      const heading = document.createElement("h2");
      const link = document.createElement("a");
      const frame = document.createElement("iframe");

      link.href = item.link;
      const faviconBox = document.createElement("span");
      const fallback = document.createElement("span");
      const favicon = document.createElement("img");
      const faviconURL = new URL(item.icon || "/favicon.ico", item.link).href;

      faviconBox.className = "site-favicon";
      faviconBox.setAttribute("aria-hidden", "true");
      fallback.textContent = item.name[0].toUpperCase();
      favicon.alt = "";
      favicon.width = 20;
      favicon.height = 20;
      favicon.hidden = true;
      favicon.referrerPolicy = "no-referrer";
      favicon.addEventListener("load", () => {
        favicon.hidden = false;
        fallback.hidden = true;
      });
      favicon.addEventListener("error", () => {
        favicon.hidden = true;
        fallback.hidden = false;
      });
      if (!item.deferIcon) favicon.src = faviconURL;
      faviconBox.append(fallback, favicon);
      link.append(faviconBox, document.createTextNode(item.name));

      // An SSO frame may establish the cookie needed to fetch its icon.
      frame.addEventListener("load", () => {
        if (favicon.naturalWidth === 0) favicon.src = faviconURL;
      });
      frame.dataset.src = item.link;
      if (item.embed !== false) frame.src = item.link;
      frame.loading = "eager";
      frame.referrerPolicy = "no-referrer";
      frame.title = item.name;

      heading.appendChild(link);
      card.appendChild(heading);
      if (item.embed === false) {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        const preview = document.createElement("div");
        const open = document.createElement("a");
        preview.className = "link-preview";
        open.href = item.link;
        open.target = "_blank";
        open.rel = "noopener noreferrer";
        open.textContent = `Open ${item.name} in a new tab`;
        preview.appendChild(open);
        card.appendChild(preview);
      } else {
        card.appendChild(frame);
      }
      grid.appendChild(card);
    }

    document.getElementById("reload").addEventListener("click", () => {
      for (const frame of document.querySelectorAll("#grid iframe")) {
        loadFrame(frame, frame.dataset.src);
      }
    });
  </script>
</body>
</html>
